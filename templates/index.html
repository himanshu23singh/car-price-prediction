<!DOCTYPE html>
<html>

<head>
    <title>Car Price Prediction</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>Car Price Prediction</h1>

        <p class="description">
            Enter your car details to predict its selling price.
        </p>

        <form id="carForm">

            <div class="field">
                <label>Car Name:</label>
                <input type="text" id="car_name" required>
            </div>

            <div class="field">
                
                
                    <label>Brand:</label>
                
                    <select id="brand" required>
                
                        <option value="">Select Brand</option>
                
                        {% for brand in brands %}
                        <option value="{{ brand }}">{{ brand }}</option>
                        {% endfor %}
                
                    </select>
                
                
            </div>

            <div class="field">
                <label>Model:</label>
                <input type="text" id="model" required>
            </div>

            <div class="field">
                <label>Vehicle Age:</label>
                <input type="number" id="vehicle_age" required>
            </div>

            <div class="field">
                <label>KM Driven:</label>
                <input type="number" id="km_driven" required>
            </div>

            <div class="field">
                <label>Seller Type:</label>
                
                <select id="seller_type" required>
                    <option value="">Select Seller Type</option>
                    <option value="Dealer">Dealer</option>
                    <option value="Individual">Individual</option>
                    <option value="Trustmark Dealer">Trustmark Dealer</option>
                </select>
            </div>

            <div class="field">
               
                    <label>Fuel Type:</label>
                
                    <select id="fuel_type" required>
                        <option value="">Select Fuel Type</option>
                        <option value="Petrol">Petrol</option>
                        <option value="Diesel">Diesel</option>
                        <option value="CNG">CNG</option>
                        <option value="LPG">LPG</option>
                        <option value="Electric">Electric</option>
                    </select>
                
            </div>

            <div class="field">
            <label>Transmission:</label>
            
            <select id="transmission_type" required>
                <option value="">Select Transmission</option>
                <option value="Manual">Manual</option>
                <option value="Automatic">Automatic</option>
            </select>
            </div>

            <div class="field">
                <label>Mileage:</label>
                <input type="number" step="any" id="mileage" required>
            </div>

            <div class="field">
                <label>Engine:</label>
                <input type="number" id="engine" required>
            </div>

            <div class="field">
                <label>Max Power:</label>
                <input type="number" step="any" id="max_power" required>
            </div>

            <div class="field">
                <label>Seats:</label>
                <input type="number" id="seats" required>
            </div>

            <button type="submit" id="predictButton">
                Predict Price
            </button>

        </form>

        <h2 id="result"></h2>

    </div>


    <script>

        document.getElementById("carForm").addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();

                const data = {

                    car_name:
                        document.getElementById("car_name").value,

                    brand:
                        document.getElementById("brand").value,

                    model:
                        document.getElementById("model").value,

                    vehicle_age:
                        Number(
                            document.getElementById("vehicle_age").value
                        ),

                    km_driven:
                        Number(
                            document.getElementById("km_driven").value
                        ),

                    seller_type:
                        document.getElementById("seller_type").value,

                    fuel_type:
                        document.getElementById("fuel_type").value,

                    transmission_type:
                        document.getElementById("transmission_type").value,

                    mileage:
                        Number(
                            document.getElementById("mileage").value
                        ),

                    engine:
                        Number(
                            document.getElementById("engine").value
                        ),

                    max_power:
                        Number(
                            document.getElementById("max_power").value
                        ),

                    seats:
                        Number(
                            document.getElementById("seats").value
                        )
                };


                const response = await fetch("/predict", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(data)

                });


                const result = await response.json();


                const price = result.predicted_price;

                const priceInLakh = price / 100000;

                document.getElementById("result").innerText =
                    "Estimated Price: ₹" + priceInLakh.toFixed(2) + " Lakhs";
            }
        );

    </script>

</body>

</html>
